<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專屬雙人日曆</title>
  <!-- 引入 FullCalendar 套件 -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background-color: #f9f9f9; }
    #setup-panel { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
    button { padding: 10px; width: 100%; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    #calendar { max-width: 900px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- 首次連線的設定區塊 -->
  <div id="setup-panel">
    <h3>首次連線設定</h3>
    <input type="text" id="gist-id" placeholder="輸入 Gist ID (剛剛儲存的長字串)">
    <input type="password" id="gh-token" placeholder="輸入 GitHub Token (ghp_開頭的字串)">
    <button onclick="saveSettings()">儲存並載入日曆</button>
  </div>

  <!-- 日曆顯示區塊 -->
  <div id="calendar"></div>

  <script src="app.js"></script>
</body>
</html>
