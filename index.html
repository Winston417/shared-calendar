<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專屬雙人日曆 (Google Drive 版)</title>
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  
  <!-- 引入 Google API -->
  <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
  <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>

  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background-color: #f9f9f9; }
    #setup-panel, #auth-panel { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto 15px auto; }
    input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
    button { padding: 10px; width: 100%; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 5px;}
    button.google-btn { background: #4285F4; }
    #calendar { max-width: 900px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- 第一次設定 ID 的區塊 -->
  <div id="setup-panel">
    <h3>系統設定</h3>
    <input type="text" id="client-id" placeholder="輸入 Google Client ID">
    <input type="text" id="file-id" placeholder="輸入 Google Drive File ID">
    <button onclick="saveSettings()">儲存設定</button>
  </div>

  <!-- Google 登入區塊 -->
  <div id="auth-panel" style="display: none;">
    <h3 style="margin-top: 0;">請登入以同步日曆</h3>
    <button class="google-btn" onclick="handleAuthClick()">使用 Google 帳號登入</button>
  </div>

  <div id="calendar" style="display: none;"></div>

  <script src="app.js"></script>
</body>
</html>
